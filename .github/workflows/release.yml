name: Release

# Создайте на GitHub релиз с тегом вида v2.1.0 — workflow подставит версию и ссылку
# на архив в module.json, соберёт module.zip и прикрепит оба файла к релизу.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Подставить версию и ссылку на архив в module.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DOWNLOAD="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/module.zip"
          jq --arg v "$VERSION" --arg d "$DOWNLOAD" '.version = $v | .download = $d' module.json > module.tmp
          mv module.tmp module.json

      - name: Собрать module.zip
        run: zip -r module.zip module.json README.md scripts styles templates

      - name: Прикрепить файлы к релизу
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
